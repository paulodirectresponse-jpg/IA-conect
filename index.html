    <script>
      (function(){
        window.__IA_PUBLIC_ACTION__=window.__IA_PUBLIC_ACTION__||'';
        document.addEventListener('click',function(event){
          var target=event.target&&event.target.closest?event.target.closest('[data-public-action]'):null;
          if(!target)return;
          event.preventDefault();
          var action=target.getAttribute('data-public-action')||'';
          window.__IA_PUBLIC_ACTION__=action;
          window.dispatchEvent(new CustomEvent('ia:public-action',{detail:action}));
        });
      })();
